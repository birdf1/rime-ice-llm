# encoding: utf-8
# 全局补丁：覆盖 default.yaml 的默认值
patch:
  # ⚠️ 只留全拼。t9 是九宫格方案，它的规则会把数字键当成字母
  #    （2=ABC、3=DEF……），一旦误切到 t9，数字键就再也选不了字，
  #    表现就是「候选栏有 1.呀 2.亚，按 2 却出来别的东西」。
  schema_list:
    - schema: rime_ice

  # 关掉 librime 1.13 的数字分隔符功能，避免干扰数字选字
  punctuator/digit_separators: ""

  # CapsLock 在本机就是「中英文开关」——实测 Weasel 无论这个值真假，
  # 按下 CapsLock 都会进英文模式，而且模式内字母固定小写（拿不到大写）。
  # 所以保持 true，把它当纯粹的开关用；要打大写按 Shift。
  ascii_composer/good_old_caps_lock: true

  # 切换时顺手清空未上屏的编码。默认是 clear，这里写明防止以后被改掉：
  # 不清空的话会留下「有编码、没候选」的半死状态，
  # 表现就是候选栏看着在、数字键却选不中。
  ascii_composer/switch_key/Caps_Lock: clear
